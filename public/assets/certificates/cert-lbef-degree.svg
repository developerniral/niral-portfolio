<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE79A"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,0 20,20 T 40,20" fill="none" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M 20,0 Q 40,10 20,20 T 20,40" fill="none" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>
  <rect width="1200" height="850" fill="url(#guilloche)"/>

  <!-- Outer Borders -->
  <rect x="25" y="25" width="1150" height="800" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <rect x="35" y="35" width="1130" height="780" rx="6" fill="none" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="45" y="45" width="1110" height="760" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad)">
    <path d="M 45,45 L 85,45 L 85,50 L 50,50 L 50,85 L 45,85 Z"/>
    <circle cx="70" cy="70" r="4"/>
    <path d="M 1155,45 L 1115,45 L 1115,50 L 1150,50 L 1150,85 L 1155,85 Z"/>
    <circle cx="1130" cy="70" r="4"/>
    <path d="M 45,805 L 85,805 L 85,800 L 50,800 L 50,765 L 45,765 Z"/>
    <circle cx="70" cy="780" r="4"/>
    <path d="M 1155,805 L 1115,805 L 1115,800 L 1150,800 L 1150,765 L 1155,765 Z"/>
    <circle cx="1130" cy="780" r="4"/>
  </g>

  <!-- Top Academic Crest / Icon -->
  <g transform="translate(600, 130)">
    <circle cx="0" cy="0" r="44" fill="#0B1120" stroke="url(#goldGrad)" stroke-width="2"/>
    <polygon points="0,-22 24,-10 0,2 -24,-10" fill="url(#goldGrad)"/>
    <path d="M -16,-6 L -16,12 C -16,18 16,18 16,12 L 16,-6" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M 18,-8 L 26,14 L 22,14" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="24" cy="16" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Header Institution Text -->
  <text x="600" y="210" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="4">LORD BUDDHA EDUCATION FOUNDATION (LBEF)</text>
  <text x="600" y="232" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="400" letter-spacing="2">IN ASSOCIATION WITH ASIA PACIFIC UNIVERSITY (APU)</text>

  <!-- Title of Award -->
  <text x="600" y="285" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="34" font-weight="bold" letter-spacing="2">DEGREE OF BACHELOR OF SCIENCE (HONOURS)</text>
  <text x="600" y="320" text-anchor="middle" fill="#E2E8F0" font-family="Georgia, serif" font-size="22" font-style="italic">In Information Technology / Software Engineering</text>

  <line x1="400" y1="345" x2="800" y2="345" stroke="url(#goldLight)" stroke-width="1.5"/>

  <!-- Presented To -->
  <text x="600" y="385" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="3">THIS IS TO CERTIFY THAT</text>
  
  <!-- Recipient Name -->
  <text x="600" y="450" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="46" font-weight="800" letter-spacing="4">NIRAL SHAKYA</text>

  <line x1="320" y1="475" x2="880" y2="475" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Body Statement -->
  <text x="600" y="520" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400">having successfully completed the prescribed curriculum, examinations, and major project requirements</text>
  <text x="600" y="546" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400">in Software Systems, Database Management, and Web Technologies, is hereby admitted to the degree.</text>

  <!-- Major Specializations Badge -->
  <g transform="translate(600, 600)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" fill="#FCE79A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">SPECIALIZATION: SOFTWARE ENGINEERING &amp; WEB ARCHITECTURE</text>
  </g>

  <!-- Gold Seal -->
  <g transform="translate(260, 680)">
    <!-- Ribbons -->
    <polygon points="-16,25 -28,75 -8,65 0,75 -6,25" fill="#AA771C"/>
    <polygon points="16,25 28,75 8,65 0,75 6,25" fill="#D4AF37"/>
    <!-- Seal Medallion -->
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="42" fill="#0B1120" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#FCE79A" stroke-dasharray="3,2" stroke-width="1.5"/>
    <text x="0" y="-12" text-anchor="middle" fill="#FCE79A" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" letter-spacing="1">ACADEMIC</text>
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="13" font-weight="bold">HONORS</text>
    <text x="0" y="18" text-anchor="middle" fill="#FCE79A" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" letter-spacing="1">GRADUATE</text>
    <polygon points="0,-28 3,-22 8,-22 4,-18 6,-12 0,-15 -6,-12 -4,-18 -8,-22 -3,-22" fill="#D4AF37"/>
  </g>

  <!-- Signatures and Verification -->
  <g transform="translate(700, 680)">
    <line x1="-120" y1="20" x2="60" y2="20" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -90,12 Q -70,-8 -50,15 T -10,5 T 30,10" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <text x="-30" y="38" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Head of Academic Board</text>
    <text x="-30" y="52" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">LBEF Campus, Kathmandu</text>
  </g>

  <g transform="translate(970, 680)">
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -60,8 Q -40,-12 -20,12 T 20,8 T 50,14" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Registrar &amp; Dean</text>
    <text x="0" y="52" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">APU Academic Senate</text>
  </g>

  <!-- Footer Meta -->
  <text x="70" y="790" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">CREDENTIAL ID: LBEF-APU-IT-2014-NS</text>
  <text x="1130" y="790" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">VERIFIED ACADEMIC RECORD • KATHMANDU, NEPAL</text>
</svg>
