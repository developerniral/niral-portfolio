    <text x="0" y="5" text-anchor="middle" fill="#FCE79A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1.5">PHP 8+ • LARAVEL • SOLID • REPOSITORY PATTERN • REST API</text>
  </g>

  <!-- Gold Seal -->
  <g transform="translate(260, 680)">
    <polygon points="-16,25 -28,75 -8,65 0,75 -6,25" fill="#AA771C"/>
    <polygon points="16,25 28,75 8,65 0,75 6,25" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad2)"/>
    <circle cx="0" cy="0" r="42" fill="#0B1120" stroke="url(#goldGrad2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#FCE79A" stroke-dasharray="3,2" stroke-width="1.5"/>
    <text x="0" y="-12" text-anchor="middle" fill="#FCE79A" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" letter-spacing="1">CERTIFIED</text>
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="13" font-weight="bold">EXPERT</text>
    <text x="0" y="18" text-anchor="middle" fill="#FCE79A" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" letter-spacing="1">ARCHITECT</text>
  </g>

