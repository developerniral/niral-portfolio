  <g transform="translate(700, 680)">
    <line x1="-120" y1="20" x2="60" y2="20" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -90,14 Q -60,-10 -40,16 T 0,6 T 40,12" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <text x="-30" y="38" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Chief Systems Architect</text>
    <text x="-30" y="52" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Backend Engineering Division</text>
  </g>

  <g transform="translate(970, 680)">
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#64748B" stroke-width="1.5"/>
    <path d="M -50,6 Q -30,-15 -10,14 T 30,8 T 60,16" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Certification Director</text>
    <text x="0" y="52" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">International PHP Standards</text>
  </g>

  <text x="70" y="790" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">CREDENTIAL ID: LARAVEL-SR-ARCH-2021-9842</text>
  <text x="1130" y="790" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">OFFICIAL CERTIFICATION REGISTER</text>
