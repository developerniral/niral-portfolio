<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="laravelRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FF2D20"/>
      <stop offset="100%" stop-color="#C51910"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE79A"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D4AF37" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="850" fill="url(#bgGrad2)"/>
  <rect width="1200" height="850" fill="url(#dotGrid)"/>

  <!-- Outer Borders -->
  <rect x="25" y="25" width="1150" height="800" rx="8" fill="none" stroke="url(#goldGrad2)" stroke-width="3"/>
  <rect x="35" y="35" width="1130" height="780" rx="6" fill="none" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="45" y="45" width="1110" height="760" rx="4" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5" stroke-dasharray="10,5"/>

  <!-- Top Badge / Laravel & PHP Icon -->
  <g transform="translate(600, 130)">
    <circle cx="0" cy="0" r="44" fill="#0B1120" stroke="url(#laravelRed)" stroke-width="2.5"/>
    <!-- Stylized Code / Architecture Box -->
    <path d="M -18,-14 L 0,-24 L 18,-14 L 18,10 L 0,20 L -18,10 Z" fill="none" stroke="url(#laravelRed)" stroke-width="2.5"/>
    <path d="M 0,-24 L 0,20" stroke="url(#laravelRed)" stroke-width="1.5"/>
    <path d="M -18,-14 L 0,-4 L 18,-14" fill="none" stroke="url(#laravelRed)" stroke-width="2"/>
    <circle cx="0" cy="-4" r="3" fill="#D4AF37"/>
  </g>

  <text x="600" y="210" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="4">PROFESSIONAL SOFTWARE ARCHITECTURE GUILD</text>
  <text x="600" y="232" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="400" letter-spacing="2">ENTERPRISE BACKEND ENGINEERING SPECIALIZATION</text>

  <!-- Title of Award -->
  <text x="600" y="285" text-anchor="middle" fill="url(#goldGrad2)" font-family="Georgia, serif" font-size="34" font-weight="bold" letter-spacing="2">SENIOR LARAVEL &amp; PHP ARCHITECT</text>
  <text x="600" y="320" text-anchor="middle" fill="#E2E8F0" font-family="Georgia, serif" font-size="20" font-style="italic">Enterprise Design Patterns, SOLID Principles &amp; High-Throughput REST APIs</text>

  <line x1="380" y1="345" x2="820" y2="345" stroke="url(#goldGrad2)" stroke-width="1.5"/>

  <text x="600" y="385" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="3">AWARDED WITH DISTINCTION TO</text>
  
  <text x="600" y="450" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="46" font-weight="800" letter-spacing="4">NIRAL SHAKYA</text>

  <line x1="320" y1="475" x2="880" y2="475" stroke="url(#goldGrad2)" stroke-width="2"/>

  <text x="600" y="520" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400">for verified mastery in Service-Repository architecture, robust database transaction handling,</text>
  <text x="600" y="546" text-anchor="middle" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400">custom payment pipelines, microservices, and high-concurrency enterprise web systems.</text>

